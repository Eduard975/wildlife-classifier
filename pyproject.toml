[project]
name = "rafl-wildlife"
version = "0.1.0"
description = "Resource-aware federated learning with dynamic quantization for wildlife alerting on i.MX 8M Plus"
requires-python = ">=3.12"
dependencies = [
    "flwr[simulation]>=1.13",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "tensorflow>=2.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
